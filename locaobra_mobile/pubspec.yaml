name: locaobra_mobile
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Usados pelo dashboard do entregador (confirmação de entrega no local):
  image_picker: ^1.1.2 # tirar a foto da entrega na hora
  signature: ^5.5.0 # quadro de assinatura desenhada de quem recebeu

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  assets:
    - assets/imagens/Logo_LOCAOBRA.png
    - assets/imagens/andaimes.svg
    - assets/imagens/dicas.svg
    - assets/imagens/elevacao.svg
    - assets/imagens/ferramentas.svg
    - assets/imagens/interroga.svg
    - assets/imagens/pesado.svg
    - assets/imagens/img_art1.jpg
    - assets/imagens/img_art2.jpg
    - assets/imagens/img_art2(1).png
    - assets/imagens/homebanner1.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"