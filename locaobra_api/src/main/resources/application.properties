spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.application.name=api
spring.web.resources.static-locations=file:uploads/
spring.mvc.static-path-pattern=/uploads/**
 
# Configurações de acesso ao Supabase (PostgreSQL) — Session pooler
# Valores vêm de variáveis de ambiente (definidas no Render). Os valores entre
# ":" são o FALLBACK usado só em desenvolvimento local.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
 
# ===================== POOL DE CONEXÕES (HikariCP) =====================
# O Supabase (Session Pooler) limita max clients a 15. O default do Hikari
# é 10 e, somado a outros consumidores do mesmo banco (outro deploy, dev
# local, outra instância), estoura o limite com "EMAXCONNSESSION". Com 5
# conexões por instância sobram vagas e o app continua saudável.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
# Usa a porta do Render (PORT) quando existir; senão usa 8080 (local)
server.port=${PORT:8080}
 
# Segredo de assinatura JWT — definir em produção via variável de ambiente.
# JAMAIS commitar a mesma chave usada em produção.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
# Supabase Storage (imagens de upload). Se vazio, o StorageService usa disco local.
supabase.apiUrl=${SUPABASE_API_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:uploads}
# Origens permitidas no CORS, separadas por vírgula. Se vazio, usa os defaults
# do SecurityConfig (localhost + https://locaobra-7c7d.vercel.app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
 
## Server connections configuration
server.tomcat.threads.max=200
server.max-http-request-header-size=64KB
server.tomcat.max-swallow-size=2MB
server.address=0.0.0.0

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.springframework.web.servlet.resource=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG